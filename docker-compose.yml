services:
  db:
    image: postgres:16-alpine
    container_name: interviewshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewshield
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: interviewshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
